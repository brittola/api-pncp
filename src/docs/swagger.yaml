openapi: 3.0.0
info:
  title: API PNCP
  version: 1.0.0
  description: API REST para consulta de contratações públicas do PNCP com autenticação JWT.

servers:
  - url: http://localhost:3000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    ValidationError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              msg:
                type: string
              path:
                type: string
              location:
                type: string

    RegisterBody:
      type: object
      required:
        - nome
        - email
        - senha
        - cnpj
      properties:
        nome:
          type: string
          example: Empresa X Ltda
        email:
          type: string
          format: email
          example: contato@empresa.com
        senha:
          type: string
          minLength: 6
          example: senha123
        cnpj:
          type: string
          minLength: 14
          maxLength: 14
          example: "11222333000181"

    LoginBody:
      type: object
      required:
        - email
        - senha
      properties:
        email:
          type: string
          format: email
          example: contato@empresa.com
        senha:
          type: string
          example: senha123

    UserResponse:
      type: object
      properties:
        id:
          type: string
          example: 64a1b2c3d4e5f6a7b8c9d0e1
        nome:
          type: string
          example: Empresa X Ltda
        email:
          type: string
          example: contato@empresa.com

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    OrgaoEntidade:
      type: object
      properties:
        cnpj:
          type: string
        razaoSocial:
          type: string
        poderId:
          type: string
        esferaId:
          type: string

    UnidadeOrgao:
      type: object
      properties:
        ufNome:
          type: string
        codigoUnidade:
          type: string
        ufSigla:
          type: string
        municipioNome:
          type: string
        nomeUnidade:
          type: string
        codigoIbge:
          type: string

    Contratacao:
      type: object
      properties:
        _id:
          type: string
        numeroControlePNCP:
          type: string
        processo:
          type: string
        objetoCompra:
          type: string
        modalidadeNome:
          type: string
        valorTotalEstimado:
          type: number
        anoCompra:
          type: integer
        dataInclusao:
          type: string
          format: date-time
        dataPublicacaoPncp:
          type: string
          format: date-time
        orgaoEntidade:
          $ref: '#/components/schemas/OrgaoEntidade'
        unidadeOrgao:
          $ref: '#/components/schemas/UnidadeOrgao'

    PaginatedContratacoes:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Contratacao'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 19
        totalPages:
          type: integer
          example: 2

    ChecklistItem:
      type: object
      properties:
        key:
          type: string
          example: habilitacao_juridica
        checked:
          type: boolean
          example: false

    ChecklistResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'

    ChecklistUpdateBody:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - key
              - checked
            properties:
              key:
                type: string
                enum:
                  - habilitacao_juridica
                  - regularidade_fiscal
                  - regularidade_trabalhista
                  - qualificacao_tecnica
                  - qualificacao_economico_financeira
                  - proposta_comercial
                  - prazos_e_forma_de_envio
                example: regularidade_fiscal
              checked:
                type: boolean
                example: true

    AlertUpdateBody:
      type: object
      required:
        - alertDate
      properties:
        alertDate:
          type: string
          format: date
          nullable: true
          example: "2026-06-30"
          description: Data do alerta em YYYY-MM-DD, ou null para limpar
        alertDone:
          type: boolean
          example: false
          description: Marca o alerta como concluído (opcional)

    AlertResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            contratacaoId:
              type: string
              example: "665f1c2a9b1e8a0012ab34cd"
            alertDate:
              type: string
              format: date
              nullable: true
              example: "2026-06-30"
            alertDone:
              type: boolean
              example: false
            savedAt:
              type: string
              format: date-time
              example: "2026-06-04T12:00:00.000Z"

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Cadastro de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login e geração de token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /contratacoes:
    get:
      tags:
        - Contratações
      summary: Listagem paginada de contratações
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          description: Número da página (10 itens por página)
        - in: query
          name: uf
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: PE
          required: false
          description: Filtra por UF (sigla com 2 letras) em unidadeOrgao.ufSigla
        - in: query
          name: valorMin
          schema:
            type: number
            minimum: 0
          required: false
          description: Valor mínimo (valorTotalEstimado >= valorMin)
        - in: query
          name: valorMax
          schema:
            type: number
            minimum: 0
            example: 80000
          required: false
          description: Valor máximo (valorTotalEstimado <= valorMax)
        - in: query
          name: q
          schema:
            type: string
            example: carimbo
          required: false
          description: Busca textual (case-insensitive) em objetoCompra
        - in: query
          name: modalidade
          schema:
            type: integer
            example: 8
          required: false
          description: Filtra por modalidadeId (ex.- 6 Pregão, 8 Dispensa)
        - in: query
          name: ano
          schema:
            type: integer
            example: 2026
          required: false
          description: Filtra por anoCompra
        - in: query
          name: situacao
          schema:
            type: integer
            example: 1
          required: false
          description: Filtra por situacaoCompraId (ex.- 1 Divulgada no PNCP)
        - in: query
          name: dataPublicacaoInicio
          schema:
            type: string
            format: date
            example: "2026-03-01"
          required: false
          description: Data inicial (ISO 8601) — dataPublicacaoPncp >= valor
        - in: query
          name: dataPublicacaoFim
          schema:
            type: string
            format: date
            example: "2026-03-31"
          required: false
          description: Data final (ISO 8601) — dataPublicacaoPncp <= valor. Para incluir o dia inteiro, use T23-59-59
      responses:
        '200':
          description: Lista de contratações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContratacoes'
        '401':
          description: Token não fornecido ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Parâmetro page inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /contratacoes/{id}:
    get:
      tags:
        - Contratações
      summary: Busca uma contratação por id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ObjectId da contratação
      responses:
        '200':
          description: Contratação encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Contratacao'
        '401':
          description: Token não fornecido ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Contratação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: id em formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /contratacoes/{id}/checklist:
    get:
      tags:
        - Contratações
      summary: Retorna o checklist do usuário para a contratação (cria se não existir)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ObjectId da contratação
      responses:
        '200':
          description: Checklist do usuário (todos os itens desmarcados na primeira vez)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistResponse'
        '401':
          description: Token não fornecido ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Contratação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: id em formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    put:
      tags:
        - Contratações
      summary: Marca/desmarca itens do checklist do usuário para a contratação
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ObjectId da contratação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistUpdateBody'
      responses:
        '200':
          description: Checklist atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistResponse'
        '401':
          description: Token não fornecido ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Contratação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Dados inválidos (id, items ou key/checked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /contratacoes/{id}/alert:
    patch:
      tags:
        - Contratações
      summary: Define/atualiza o alerta (prazo) do usuário para a contratação
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ObjectId da contratação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdateBody'
      responses:
        '200':
          description: Alerta salvo/atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '401':
          description: Token não fornecido ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Contratação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Dados inválidos (id ou alertDate/alertDone)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
